<!DOCTYPE html>
<html>
<head>
  <title>Times Tables + Firebase Leaderboard</title>
  <script type="module">
    // Import Firebase modules (from their CDN)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit } 
      from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

   // Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyA70to_jXGxjgGW0TlhiQt7RzG44Fq9NH4",
  authDomain: "times-tables-9bf0b.firebaseapp.com",
  projectId: "times-tables-9bf0b",
  storageBucket: "times-tables-9bf0b.firebasestorage.app",
  messagingSenderId: "803197098647",
  appId: "1:803197098647:web:5be190c94ab5e66fbfa7d2",
  measurementId: "G-KDH848CEXH"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
    // 🔹 Initialize Firebase + Firestore
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 🔹 Save a score
    async function saveScore(name, score) {
      try {
        await addDoc(collection(db, "scores"), {
          name: name,
          score: score,
          date: new Date()
        });
        console.log("Score saved!");
      } catch (e) {
        console.error("Error adding score: ", e);
      }
    }

    // 🔹 Load top 5 scores
    async function loadScores() {
      const q = query(collection(db, "scores"), orderBy("score", "desc"), limit(5));
      const querySnapshot = await getDocs(q);
      const leaderboard = document.getElementById("leaderboard");
      leaderboard.innerHTML = "";
      querySnapshot.forEach((doc) => {
        const data = doc.data();
        leaderboard.innerHTML += `<li>${data.name}: ${data.score}</li>`;
      });
    }

    // 🔹 Example usage (just for demo)
    window.submitScore = async () => {
      const name = document.getElementById("name").value;
      const score = Math.floor(Math.random() * 12); // random score for demo
      await saveScore(name, score);
      await loadScores();
    };

    // Load scores when page opens
    window.onload = loadScores;
  </script>
</head>
<body>
  <h1>Times Tables Leaderboard (Demo)</h1>
  <input id="name" placeholder="Your name" />
  <button onclick="submitScore()">Submit Random Score</button>

  <h3>Top Scores:</h3>
  <ul id="leaderboard"></ul>
</body>
</html>
